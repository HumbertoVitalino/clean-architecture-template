services:
  postgres-test:
    image: postgres:18-alpine
    container_name: integration-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "Integration@Test123"
      POSTGRES_DB: integration_tests_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d integration_tests_db"]
      interval: 10s
      retries: 10
      start_period: 30s
      timeout: 5s
