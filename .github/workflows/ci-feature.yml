name: CI - Feature

on:
  push:
    branches:
      - 'feature/**'

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore CompanyName.ProjectName.slnx

      - name: Build
        run: dotnet build CompanyName.ProjectName.slnx --no-restore --configuration Release

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore CompanyName.ProjectName.slnx

      - name: Unit Tests
        run: >
          dotnet test
          tests/CompanyName.ProjectName.UnitTests/CompanyName.ProjectName.UnitTests.csproj
          --no-restore
          --configuration Release
          --logger "trx;LogFileName=unit-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: '**/*.trx'

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore CompanyName.ProjectName.slnx

      - name: Start PostgreSQL
        run: docker compose -f docker-compose.tests.yml up -d

      - name: Wait for PostgreSQL to be healthy
        run: |
          echo "Waiting for PostgreSQL..."
          until [ "$(docker inspect integration-postgres --format '{{.State.Health.Status}}')" = "healthy" ]; do
            echo "  still waiting..."
            sleep 5
          done
          echo "PostgreSQL is ready."

      - name: Integration Tests
        run: >
          dotnet test
          tests/CompanyName.ProjectName.IntegrationTests/CompanyName.ProjectName.IntegrationTests.csproj
          --no-restore
          --configuration Release
          --logger "trx;LogFileName=integration-results.trx"
        env:
          ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=integration_tests_db;Username=postgres;Password=Integration@Test123"

      - name: Stop PostgreSQL
        if: always()
        run: docker compose -f docker-compose.tests.yml down

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: '**/*.trx'

  functional-tests:
    name: Functional Tests
    runs-on: ubuntu-latest
    needs: integration-tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore CompanyName.ProjectName.slnx

      - name: Functional Tests
        run: >
          dotnet test
          tests/CompanyName.ProjectName.FunctionalTests/CompanyName.ProjectName.FunctionalTests.csproj
          --no-restore
          --configuration Release
          --logger "trx;LogFileName=functional-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: functional-test-results
          path: '**/*.trx'
