name: CI - Develop

on:
  push:
    branches:
      - develop

jobs:
  build-and-test:
    name: Build & Full Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Unit Tests
        run: >
          dotnet test
          tests/CompanyName.ProjectName.UnitTests/CompanyName.ProjectName.UnitTests.csproj
          --no-build
          --configuration Release
          --logger "trx;LogFileName=unit-results.trx"

      - name: Integration Tests
        run: >
          dotnet test
          tests/CompanyName.ProjectName.IntegrationTests/CompanyName.ProjectName.IntegrationTests.csproj
          --no-build
          --configuration Release
          --logger "trx;LogFileName=integration-results.trx"

      - name: Functional Tests
        run: >
          dotnet test
          tests/CompanyName.ProjectName.FunctionalTests/CompanyName.ProjectName.FunctionalTests.csproj
          --no-build
          --configuration Release
          --logger "trx;LogFileName=functional-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/*.trx'

  open-release-pr:
    name: Open PR to Release
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if release branch exists
        id: check-release
        run: |
          if git ls-remote --exit-code --heads origin release; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Release branch not found — skipping PR creation."
          fi

      - name: Open PR develop → release
        if: steps.check-release.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base release \
            --head develop \
            --title "release: promote develop to release" \
            --body "## Automated Release PR

          All CI checks passed on \`develop\`. This PR was opened automatically.

          ### Checklist
          - [ ] Review changes
          - [ ] Confirm all tests passed in CI
          - [ ] Approve and merge to trigger deployment" \
            --label release \
          || echo "::notice::PR already exists between develop and release."
